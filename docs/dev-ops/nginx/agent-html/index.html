<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Agent 智能对话</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./js/config.js"></script>
    <style>
        /* 输入区域整体为列布局，容纳计数器和输入行 */
        .input-area {
            flex-direction: column;
            gap: 8px; /* 输入行与计数器之间的间距 */
        }

        /* 输入行：让文本输入框自动填满剩余宽度 */
        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            width: 100%; /* 确保占满父容器宽度 */
        }

        /* 文本输入框：自动伸缩填满可用空间 */
        .input-box {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 32px;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: 0.2s;
            line-height: 1.5;
            overflow-y: hidden;   /* 去掉滚动条 */
            max-height: none;     /* 不限制最大高度，自动撑开 */
        }

        /* 计数器样式 */
        .char-counter {
            font-size: 0.7rem;
            text-align: right;
            margin-right: 12px;
            color: #8a9bb0;
        }

        .char-counter.warning {
            color: #e67e22;
        }

        .char-counter.danger {
            color: #e74c3c;
        }

        /* 确保发送按钮不与输入框错位 */
        .send-btn {
            align-self: flex-end;
            white-space: nowrap; /* 防止按钮文字换行 */
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 左侧栏 -->
    <div class="sidebar">
        <div class="agent-header">
            <h2>✨ AI Agent</h2>
            <div class="agent-badge">智能中枢</div>
        </div>
        <div class="agent-card">
            <div class="agent-name">
                <span id="currentAgentName">未选择</span>
            </div>
            <div class="agent-desc" id="currentAgentDesc">请先登录并选择智能体</div>
        </div>
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">🤖 Agent 状态</span>
                <span class="status-badge" id="agentStateLabel">⚪ 空闲</span>
            </div>
            <div class="status-item">
                <span class="status-label">💭 思考/等候</span>
                <span class="status-value" id="agentThinkingStatus">等候中</span>
            </div>
            <div class="status-item">
                <span class="status-label">📊 已消耗 Token</span>
                <span class="status-value" id="tokenUsage">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">🆔 会话 ID</span>
                <span class="status-value" id="sessionIdDisplay">-</span>
            </div>
        </div>
        <button class="switch-agent-btn" id="switchAgentBtn">⇄ 切换智能体</button>
        <div style="margin-top: auto; font-size: 0.7rem; color: #8ba0bc; text-align: center; margin-top: 32px;">
            Powered by Pumluda AI
        </div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="chat-main">
        <div class="chat-header">
            <h1>💬 与 AI 对话 · 流式智能体验</h1>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="message assistant-message">
                <div class="message-bubble">👋 你好！请先登录账号，然后选择一个智能体开始交流吧~</div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-row">
                <textarea class="input-box" id="messageInput" rows="1" maxlength="200"
                          placeholder="输入你的问题... (Enter 发送, Shift+Enter 换行)"></textarea>
                <button class="send-btn" id="sendBtn">发送 ✨</button>
            </div>
            <div class="char-counter" id="charCounter">0 / 200</div>
        </div>
    </div>
</div>
<script src="./js/app.js"></script>
</body>
</html>
