server {
    listen 80;
    server_name _;

    # 静态页面（拼团商城）
    root /usr/share/nginx/html;
    index index.html;

    # Agent 前端静态页面（独立目录，避免和商城 index.html 冲突）
    location /agent/ {
        alias /opt/agent-frontend/;
        index index.html;
        try_files $uri $uri/ /agent/index.html;
    }

    # Agent API 反向代理 → AI Agent 服务
    location /api/agent/ {
        proxy_pass http://AI-Agent:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;       # SSE 长连接，默认 60s 不够
        proxy_connect_timeout 5s;
        proxy_buffering off;           # 关键！关闭缓冲，否则流式数据被 nginx 攒批
        proxy_cache off;
    }

    # 商城 API 反向代理 → 后端 Java 服务
    location /api/ {
        proxy_pass http://group-buy-market:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 页面路由 (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
