<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>拼团商城 · 限时特惠</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
<div class="app-container">
    <!-- 轮播图 -->
    <div class="carousel">
        <div class="carousel-inner" id="carouselInner">
            <div class="carousel-slide active">
                <img class="carousel-img"
                     src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'%3E%3Crect width='800' height='450' fill='%23FF8C42'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='28' font-weight='bold'%3E爆款秒杀专场%3C/text%3E%3C/svg%3E"
                     alt="banner1">
            </div>
            <div class="carousel-slide">
                <img class="carousel-img"
                     src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'%3E%3Crect width='800' height='450' fill='%23339966'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='28' font-weight='bold'%3E百亿补贴 限时抢%3C/text%3E%3C/svg%3E"
                     alt="banner2">
            </div>
            <div class="carousel-slide">
                <img class="carousel-img"
                     src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450'%3E%3Crect width='800' height='450' fill='%23E85D5D'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='28' font-weight='bold'%3E拼团狂欢 低至1折%3C/text%3E%3C/svg%3E"
                     alt="banner3">
            </div>
        </div>
        <div class="carousel-indicators" id="indicators"></div>
    </div>

    <!-- 商品介绍 -->
    <div class="card">
        <div class="goods-title">📚 MySQL：从删库到跑路 · 实战进阶宝典</div>
        <div class="flex-between">
            <div class="goods-desc">🔥 全网热卖10w+ 好评如潮</div>
            <div style="font-size:13px; color:#888;">已售 2.3w件</div>
        </div>
    </div>

    <!-- 优惠广告 -->
    <div class="promo-banner">
        <span>🎉 大促优惠进行中，参与拼团价格直接20元！<span class="promo-tag">限时补贴</span></span>
        <span>⚡ 最后抢购</span>
    </div>

    <!-- 拼团双卡片 -->
    <div class="card" style="padding-bottom: 12px;">
        <div class="section-title">👥 好友拼单 · 成团更快</div>
        <div class="group-row" id="groupList"></div>
    </div>

    <!-- 价格区块 单独购买/开团购买 -->
    <div class="card">
        <div class="price-row">
            <div class="price-tag">
                <span class="price-current"><small>¥</small>20<span style="font-size:14px;">.00</span></span>
                <span class="price-old">¥120</span>
                <span style="background:#fee; padding:2px 8px; border-radius:20px; font-size:12px;">拼团价</span>
            </div>
            <div class="action-buttons">
                <button class="btn-outline" id="singleBuyBtn">单独购买 ¥100</button>
                <button class="btn-primary-red" id="groupBuyBtn">👥 开团购买 ¥20</button>
            </div>
        </div>
        <div class="flex-between mt-1">
            <span style="font-size:13px; color:#999;">单独购买原价 $120  →  拼团超值 $20</span>
            <span style="color:#e4393c; font-size:12px;">🔥 2人成团</span>
        </div>
    </div>

    <!-- 登录状态快捷栏 (可快速登出) -->
    <div class="quick-login-card" id="quickLoginCard">
        <div class="user-greeting" id="userGreeting">👋 未登录，点击购买请先登录</div>
        <button class="logout-btn" id="manualLoginBtn" style="background:#e4393c; color:white;">去登录</button>
    </div>
</div>

<!-- 登录模态框 -->
<div id="loginModal" class="modal-mask">
    <div class="modal-container">
        <div class="modal-header">
            <span>欢迎登录 · 拼团商城</span>
            <span class="modal-close" data-close="loginModal">&times;</span>
        </div>
        <div class="modal-body">
            <div class="input-group-modal">
                <input type="text" id="loginUsername" placeholder="手机号 / 用户名" value="拼团达人">
            </div>
            <div class="input-group-modal">
                <input type="password" id="loginPassword" placeholder="密码" value="123456">
            </div>
            <button class="login-modal-btn" id="doLoginBtn">登 录</button>
            <div class="text-center mt-1" style="font-size:12px; color:#aaa;">新用户1元拼团特权</div>
        </div>
    </div>
</div>

<!-- 支付模态框 (扫码支付) -->
<div id="payModal" class="modal-mask">
    <div class="modal-container">
        <div class="modal-header">
            <span>请扫码支付</span>
            <span class="modal-close" data-close="payModal">&times;</span>
        </div>
        <div class="modal-body">
            <div class="pay-qrcode">
                <div class="qrcode-sim">📱 微信/支付宝 扫码支付</div>
                <div class="pay-amount-modal" id="modalPayAmount">支付金额 ¥20.00</div>
                <div style="font-size:12px; color:#888;">长按识别或截图扫码</div>
            </div>
            <div class="pay-actions-modal">
                <button class="btn-outline" id="modalCancelPay">取消支付</button>
                <button class="btn-primary-red" id="modalConfirmPay">确认支付</button>
            </div>
        </div>
    </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
